name: Build

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  pull_request:
    branches:
      - main

# Every image push goes to BOTH registries
# GHCR_IMAGE is our default one
env:
  GAR_IMAGE: us-docker.pkg.dev/castai-hub/library/audit-logs-receiver
  GHCR_IMAGE: ghcr.io/castai/images/audit-logs-receiver

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Go 1.27.2
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.2

      - name: Install dependency
        run: go install go.opentelemetry.io/collector/cmd/builder@v0.163.0

      - name: Set build metadata
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "RELEASE_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          fi
          echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Prepare release
        run: builder --skip-compilation --config builder-config.yaml

      - name: Build Go binary amd64
        run: cd castai-collector && go build -ldflags "-s -w -X main.GitCommit=$GITHUB_SHA -X main.GitRef=$GITHUB_REF -X main.Version=${RELEASE_TAG:-commit-$GITHUB_SHA}" -o castai-collector-amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0

      - name: Build Go binary arm64
        run: cd castai-collector && go build -ldflags "-s -w -X main.GitCommit=$GITHUB_SHA -X main.GitRef=$GITHUB_REF -X main.Version=${RELEASE_TAG:-commit-$GITHUB_SHA}" -o castai-collector-arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0

      - name: Test
        run: cd auditlogsreceiver && go test -race ./...

      - name: Test v2
        run: cd auditlogsreceiver/v2 && go test -race ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v2
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.ARTIFACT_BUILDER_JSON_KEY }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pr
        id: build_pr
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/castai/audit-logs-receiver
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.created=${{ env.CREATED }}
            org.opencontainers.image.title=audit-logs-receiver
            org.opencontainers.image.vendor=CAST AI
            distribution-scope=public
            ai.cast.image.canonical-registry=us-docker.pkg.dev/castai-hub/library
          annotations: |
            index,manifest:org.opencontainers.image.source=https://github.com/castai/audit-logs-receiver
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.created=${{ env.CREATED }}
            index,manifest:org.opencontainers.image.title=audit-logs-receiver
            index,manifest:distribution-scope=public
            index,manifest:ai.cast.image.canonical-registry=us-docker.pkg.dev/castai-hub/library

      - name: Build and push main
        id: build_main
        if: github.event_name != 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.GAR_IMAGE }}:${{ github.sha }}
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/castai/audit-logs-receiver
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.created=${{ env.CREATED }}
            org.opencontainers.image.title=audit-logs-receiver
            org.opencontainers.image.vendor=CAST AI
            distribution-scope=public
            ai.cast.image.canonical-registry=us-docker.pkg.dev/castai-hub/library
          annotations: |
            index,manifest:org.opencontainers.image.source=https://github.com/castai/audit-logs-receiver
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.created=${{ env.CREATED }}
            index,manifest:org.opencontainers.image.title=audit-logs-receiver
            index,manifest:distribution-scope=public
            index,manifest:ai.cast.image.canonical-registry=us-docker.pkg.dev/castai-hub/library

      - name: Build and push release
        id: build_release
        if: github.event_name == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64,linux/amd64
          tags: |
            ${{ env.GAR_IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.GAR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.GHCR_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/castai/audit-logs-receiver
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.created=${{ env.CREATED }}
            org.opencontainers.image.title=audit-logs-receiver
            org.opencontainers.image.vendor=CAST AI
            distribution-scope=public
            ai.cast.image.canonical-registry=us-docker.pkg.dev/castai-hub/library
          annotations: |
            index,manifest:org.opencontainers.image.source=https://github.com/castai/audit-logs-receiver
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.created=${{ env.CREATED }}
            index,manifest:org.opencontainers.image.title=audit-logs-receiver
            index,manifest:distribution-scope=public
            index,manifest:ai.cast.image.canonical-registry=us-docker.pkg.dev/castai-hub/library

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      - name: Sign the images (keyless)
        env:
          DIGEST_PR: ${{ steps.build_pr.outputs.digest }}
          DIGEST_MAIN: ${{ steps.build_main.outputs.digest }}
          DIGEST_RELEASE: ${{ steps.build_release.outputs.digest }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            release)      refs="${GAR_IMAGE}@${DIGEST_RELEASE} ${GHCR_IMAGE}@${DIGEST_RELEASE}" ;;
            pull_request) refs="${GHCR_IMAGE}@${DIGEST_PR}" ;;
            *)            refs="${GAR_IMAGE}@${DIGEST_MAIN} ${GHCR_IMAGE}@${DIGEST_MAIN}" ;;
          esac
          for ref in ${refs}; do
            cosign sign --yes "${ref}"
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github.com/castai/audit-logs-receiver/' \
              "${ref}" >/dev/null
            echo "signed and verified ${ref}"
          done

      - name: Docker pull for fossa main
        if: github.event_name == 'release'
        run: docker pull ${{ env.GAR_IMAGE }}:${{ env.RELEASE_TAG }}

      - name: FOSSA scan docker image
        if: github.event_name == 'release'
        continue-on-error: true
        uses: fossas/fossa-action@v1
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          container: ${{ env.GAR_IMAGE }}:${{ env.RELEASE_TAG }}
