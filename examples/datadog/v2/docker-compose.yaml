services:
  otelcol:
    build:
      context: ../..
      dockerfile: examples/datadog/v2/Dockerfile
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    environment:
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_API_KEY=${DD_API_KEY}
      - CASTAI_API_URL=${CASTAI_API_URL:-https://api.cast.ai}
      - CASTAI_API_KEY=${CASTAI_API_KEY}
    volumes:
      - ./data:/data
