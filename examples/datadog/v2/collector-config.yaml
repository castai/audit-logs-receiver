receivers:
  castai_audit_logs_v2:
    api:
      url: ${env:CASTAI_API_URL}
      key: ${env:CASTAI_API_KEY}
    poll_interval: 10s
    page_limit: 100
    checkpoint_file: ./audit_logs_v2_checkpoint.json

processors:
  resource:
    attributes:
      - key: deployment.environment
        value: "castai-audit"
        action: upsert
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  datadog:
    hostname: "castai-collector"
    proxy_url: ${env:PROXY}
    api:
      site: ${env:DD_SITE}
      key: ${env:DD_API_KEY}
    logs:
      use_compression: true  # Enable compression for logs

service:
  pipelines:
    logs:
      receivers: [castai_audit_logs_v2]
      processors: [resource, batch]
      exporters: [datadog]
